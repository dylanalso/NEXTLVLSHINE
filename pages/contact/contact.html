<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="../../src/ui/nav/styles.css">
    <link rel="stylesheet" href="../../src/ui/footer/styles.css">
</head>

<body>
    <div id="topbar-container"></div>

    <section class="contact-section">
        <div class="contact-header">
            <h1>Get Your Free Quote</h1>
            <p>Ready for a higher standard of clean? Reach out today.</p>
        </div>

        <div class="contact-container">
            <div class="contact-info">
                <h2>Contact Details</h2>
                <div class="info-item">
                    <span class="icon">📞</span>
                    <p><a href="#" id="config-phone-link"><span id="config-phone"></span></a></p>
                </div>
                <div class="info-item">
                    <span class="icon">✉️</span>
                    <p><a href="#" id="config-email-link"><span id="config-email"></span></a></p>
                </div>
                <div class="info-item">
                    <span class="icon">📍</span>
                    <p>Serving <span id="config-area"></span></p>
                </div>
                <div class="info-item">
                    <span class="icon">🕒</span>
                    <p id="config-hours"></p>
                </div>
            </div>

            <div class="contact-form-wrapper">
                <form class="contact-form" action="http://www.randyconnolly.com/tests/process.php" method="POST">

                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email">
                    </div>

                    <div class="form-group">
                        <label for="service">Service Needed</label>
                        <select id="service" name="service">
                            <option value="house-washing">House Washing</option>
                            <option value="driveway">Driveway & Concrete</option>
                            <option value="roof">Roof Soft Washing</option>
                            <option value="other">Other / Multiple</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Project Details</label>
                        <textarea id="message" name="message" rows="4"
                            placeholder="Tell us a bit about what needs cleaning..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Send Request</button>
                </form>
            </div>
        </div>
    </section>

    <script src="../../src/data/config.js"></script>
    <script src="../../src/ui/nav/navbar.js"></script>

    <div id="footer-container"></div>

    <script src="../../src/ui/footer/footer.js"></script>
</body>

</html>
